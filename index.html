    <main class="main-content">
        <div class="welcome">
          <h1>Welcome to Dashboard</h1>
          <p>Main content goes here</p>
        </div>
        <div class="dashboard">
            <div class="stats-grid">
              <!-- Total Users Card -->
              <div class="card">
                <div class="stat-card-content">
                  <div class="stat-info">
                    <p class="stat-title">Total Users</p>
                    <p class="stat-value">24,561</p>
                  </div>
                  <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                      <circle cx="9" cy="7" r="4"></circle>
                      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                  </div>
                </div>
                <div class="trend trend-up">
                  <span class="trend-icon">↗</span>
                  +12.5%
                </div>
              </div>
        
              <!-- Revenue Card -->
              <div class="card">
                <div class="stat-card-content">
                  <div class="stat-info">
                    <p class="stat-title">Revenue</p>
                    <p class="stat-value">$45,678</p>
                  </div>
                  <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="12" y1="1" x2="12" y2="23"></line>
                      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                  </div>
                </div>
                <div class="trend trend-up">
                  <span class="trend-icon">↗</span>
                  +23.1%
                </div>
              </div>
        
              <!-- Orders Card -->
              <div class="card">
                <div class="stat-card-content">
                  <div class="stat-info">
                    <p class="stat-title">Orders</p>
                    <p class="stat-value">1,234</p>
                  </div>
                  <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="9" cy="21" r="1"></circle>
                      <circle cx="20" cy="21" r="1"></circle>
                      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                  </div>
                </div>
                <div class="trend trend-down">
                  <span class="trend-icon">↘</span>
                  -5.2%
                </div>
              </div>
        
              <!-- Active Sessions Card -->
              <div class="card">
                <div class="stat-card-content">
                  <div class="stat-info">
                    <p class="stat-title">Active Sessions</p>
                    <p class="stat-value">789</p>
                  </div>
                  <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                  </div>
                </div>
                <div class="trend trend-up">
                  <span class="trend-icon">↗</span>
                  +8.7%
                </div>
              </div>
            </div>
        
            <!-- Chart Section -->
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Performance Overview</h2>
              </div>
              <div class="chart-container">
                <div class="chart">
                  <div class="chart-bar" style="height: 66%;">
                    <span class="chart-label">Jan</span>
                  </div>
                  <div class="chart-bar" style="height: 50%;">
                    <span class="chart-label">Feb</span>
                  </div>
                  <div class="chart-bar" style="height: 83%;">
                    <span class="chart-label">Mar</span>
                  </div>
                  <div class="chart-bar" style="height: 75%;">
                    <span class="chart-label">Apr</span>
                  </div>
                  <div class="chart-bar" style="height: 100%;">
                    <span class="chart-label">May</span>
                  </div>
                  <div class="chart-bar" style="height: 92%;">
                    <span class="chart-label">Jun</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
    </main>

    <div class="login-container">
        <h2 style="margin-bottom: 1rem;">Sign In</h2>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button class="login-btn">Sign In</button>
    </div>
</body>
</html>
